name: Build container images

on:
  push:
    branches: [main]
    paths:
      - '.devcontainer/Dockerfile'
      - 'docker-compose.yaml'
      - 'backend/**'
      - 'frontend/**'
      - 'scripts/**'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Lowercase repository name
        run: echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push devcontainer
        uses: docker/build-push-action@v6
        with:
          context: .devcontainer
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.REPO_LC }}-devcontainer:latest

      - name: Build and push api-server
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.REPO_LC }}-api-server:latest

      - name: Build and push load-generator
        uses: docker/build-push-action@v6
        with:
          context: ./scripts
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.REPO_LC }}-load-generator:latest

      - name: Build and push playwright-generator
        uses: docker/build-push-action@v6
        with:
          context: ./scripts/playwright
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.REPO_LC }}-playwright-generator:latest

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.REPO_LC }}-frontend:latest
